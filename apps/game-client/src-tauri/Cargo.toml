[package]
name = "riw"
version = "0.1.0"
description = "Reunion Island Wisdom — desktop shell (Tauri)"
authors = ["UI Lab Reunion"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "riw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
