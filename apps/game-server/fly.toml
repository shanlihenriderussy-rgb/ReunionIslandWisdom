# Fly.io — RIW game server (Colyseus).
# Region jnb (Johannesburg) = la region Fly la plus proche de La Reunion
# (ocean Indien). Alternative : cdg (Paris) si jnb indisponible.
#
# Deploiement (depuis la RACINE du monorepo) :
#   fly launch --no-deploy --copy-config --name riw-game-server  # 1ere fois
#   fly deploy --config apps/game-server/fly.toml --dockerfile apps/game-server/Dockerfile
#
# Le client doit pointer sur : wss://riw-game-server.fly.dev

app = "riw-game-server"
primary_region = "jnb"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "2567"
  HOST = "0.0.0.0"
  NODE_ENV = "production"

[http_service]
  internal_port = 2567
  force_https = true
  # MMO temps reel : on NE veut PAS que la machine s'endorme (latence + perte
  # des rooms en memoire). On garde 1 machine allumee en permanence.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  # Fly route le ws upgrade et termine le TLS -> le client parle en wss://.
  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "get"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
